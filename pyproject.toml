[project]
name = "z407-plasma-remote"
version = "1.0.0"
description = "Control the Logitech Z407 speaker's own volume and bass from the KDE Plasma system tray"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mert Emirimam" }]
requires-python = ">=3.11"
dependencies = ["bleak>=1.0"]

[project.scripts]
z407d = "z407_remote.daemon:main"
z407ctl = "z407_remote.ctl:main"

[project.urls]
Repository = "https://github.com/mertemr/z407-plasma-remote"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["z407_remote"]

[dependency-groups]
dev = ["ruff>=0.15"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
